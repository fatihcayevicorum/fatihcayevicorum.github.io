# R417 candidate: restore automatic Firebase deployment on main push.
# Savings tests must pass; release approval remains a separate user decision.

name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
  workflow_dispatch:
jobs:
  savings_tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check and test R416 savings
        working-directory: functions
        run: |
          npm run check
          npm test
  build_and_deploy:
    needs: savings_tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_FATIHCAYEVI }}
          channelId: live
          projectId: fatihcayevi
      - name: Install Functions dependencies
        working-directory: functions
        run: npm ci
      - name: Deploy Firebase Functions and Firestore Rules
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_FATIHCAYEVI }}
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"
          GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-service-account.json" npx --yes firebase-tools functions:delete cleanDisabledAdminBusinessReminders --region europe-west1 --project fatihcayevi --force || true
          GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-service-account.json" npx --yes firebase-tools deploy --only functions,firestore:rules --project fatihcayevi --non-interactive --force
