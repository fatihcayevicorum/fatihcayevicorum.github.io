name: Invoice integration checks
on:
  push:
    paths:
      - 'faturalarim/**'
      - 'functions/invoices*.js'
      - 'functions/test/invoices*'
      - 'firestore.rules'
      - '.github/workflows/invoice-tests.yml'
  workflow_dispatch:
jobs:
  invoices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
        working-directory: functions
      - name: Install isolated integration test dependencies
        run: npm install --prefix /tmp/invoice-tests playwright@1.58.2 firebase-tools@15.36.0 @firebase/rules-unit-testing@5.0.0 firebase@12.16.0
      - name: Browser and Firestore integration checks
        env:
          NODE_PATH: /tmp/invoice-tests/node_modules
          CI: 'true'
        run: |
          /tmp/invoice-tests/node_modules/.bin/playwright install --with-deps chromium
          python3 -m http.server 8765 >/tmp/invoice-http.log 2>&1 &
          node functions/test/invoices-ui.cjs
          /tmp/invoice-tests/node_modules/.bin/firebase emulators:exec --only firestore --project demo-fatih-invoices 'node functions/test/invoices-emulator.cjs'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: invoice-ui-checks
          path: /tmp/invoice-*.png
          if-no-files-found: ignore
