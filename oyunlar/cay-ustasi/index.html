<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#5d1017"><title>Çay Ustası | Fatih Çay Evi</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"><link rel="stylesheet" href="style.css?v=1"><link rel="stylesheet" href="layout-fix.css?v=1"></head>
<body><header><a href="../" aria-label="Oyunlara dön"><i class="fa-solid fa-arrow-left"></i></a><div><small>FATİH ÇAY EVİ OYUNLARI</small><h1>Çay Ustası</h1></div><button id="soundButton" type="button" aria-label="Sesi aç veya kapat"><i class="fa-solid fa-volume-high"></i></button></header>
<main><section class="score-strip"><div><span>Oyuncu</span><strong id="playerName">Misafir</strong></div><div><span>En Yüksek</span><strong id="bestScore">0</strong></div><button id="changeNick" type="button"><i class="fa-solid fa-pen"></i> Nick</button></section>
<section class="game-shell"><div class="hud"><div><span id="phaseText">Başlamaya Hazır</span><strong id="timer">10</strong></div><div class="meter"><span id="meterFill"></span><i class="target"></i></div><p id="hint">Başlat'a dokun, sonra doldurmak için basılı tut.</p></div>
<div class="stage" id="stage"><div class="steam" aria-hidden="true"><i></i><i></i><i></i></div><div class="kettle" id="kettle"><img src="assets/demlik.png" alt="Çay demliği"></div><div class="pour-stream" id="pourStream"></div><div class="glass-wrap"><div class="tea-mask"><div class="tea-liquid" id="teaLiquid"><span class="wave"></span><span class="bubble b1"></span><span class="bubble b2"></span><span class="bubble b3"></span></div></div><img src="assets/cay-bardagi.png" alt="İnce belli çay bardağı ve tabağı"></div><div class="splash-layer" id="splashLayer"></div><div class="celebration" id="celebration"></div><div class="result" id="result" hidden><p id="resultKicker">SONUÇ</p><h2 id="resultTitle">Çay Ustası</h2><strong id="resultScore">1000</strong><p id="resultMessage"></p><small>Sonuç ekranı <b id="resultTimer">10</b> saniye sonra kapanacak</small></div></div>
<button class="main-button" id="startButton" type="button"><i class="fa-solid fa-play"></i><span>Oyunu Başlat</span></button><button class="pour-button" id="pourButton" type="button" disabled><i class="fa-solid fa-hand-pointer"></i><span>Çayı doldurmak için basılı tut</span></button></section>
</main><dialog id="nickDialog"><form method="dialog"><i class="fa-solid fa-user-pen nick-icon"></i><h2>Oyuncu Nicki</h2><p>Skorun bu nick ile telefonuna kaydedilecek.</p><input id="nickInput" maxlength="18" autocomplete="nickname" placeholder="Nickini yaz" required><span id="nickError"></span><div><button value="cancel" id="nickCancel" type="button">İptal</button><button value="save" id="nickSave" type="submit">Kaydet</button></div></form></dialog><script src="game.js?v=1"></script></body></html>
