<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Yönetim Merkezi | Fatih Çay Evi</title>
  <meta name="theme-color" content="#5a1018">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <link rel="stylesheet" href="../panel-header.css?v=8">
  <link rel="stylesheet" href="../panel-scroll.css?v=2">
  <link rel="stylesheet" href="style.css?v=1">
</head>
<body>
  <header class="app-header">
    <div class="header-inner">
      <div class="brand">
        <img src="../logo.png" class="brand-logo" width="72" height="72" alt="Fatih Çay Evi logosu">
        <div class="brand-copy"><p class="eyebrow">Fatih Çay Evi</p><h1>Yönetim Merkezi</h1></div>
      </div>
      <div class="header-actions">
        <div class="live-time"><strong id="currentTime">--:--</strong><span id="currentDate">--/--/--</span></div>
        <button class="logout-button" id="logoutButton" type="button" aria-label="Çıkış yap"><i class="fa-solid fa-right-from-bracket"></i><span>Güvenli Çıkış</span></button>
      </div>
    </div>
  </header>

  <main class="page-shell">
    <section class="center-section" id="dailySection">
      <div class="section-heading"><div><p class="kicker">Hızlı erişim</p><h2>Günlük İşlemler</h2></div></div>
      <div class="card-grid card-grid-daily" id="dailyGrid"></div>
    </section>

    <section class="center-section">
      <div class="section-heading"><div><p class="kicker">Tüm araçlar</p><h2>Yönetim Panelleri</h2></div></div>
      <div class="card-grid" id="managementGrid"></div>
      <p class="empty-state" id="emptyState" hidden>Bu kullanıcıya henüz yönetim paneli yetkisi verilmemiş.</p>
    </section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="script.js?v=1"></script>
  <script type="module" src="../merchant-order-alert.js?v=12"></script>
  <script type="module" src="../system-ui.js?v=14"></script>
</body>
</html>
